<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - Cars Dealership</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{font-family:Arial,sans-serif}.topbar{background:darkturquoise;padding:22px 28px}.cardbox{max-width:520px;margin:45px auto;padding:28px;border:1px solid #ddd;border-radius:8px}.field{display:block;width:100%;padding:10px;margin:7px 0 14px;border:1px solid #bbb;border-radius:4px}</style>
</head>
<body>
<nav class="topbar"><a href="/" style="font-size:24px;color:#111;text-decoration:none;font-weight:bold">Dealerships</a></nav>
<main class="cardbox">
  <h2>Create an account</h2>
  {% if error %}<p class="text-danger">{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label for="username">Username</label>
    <input class="field" id="username" name="username" required autocomplete="username">
    <label for="first_name">First name</label>
    <input class="field" id="first_name" name="first_name">
    <label for="last_name">Last name</label>
    <input class="field" id="last_name" name="last_name">
    <label for="email">Email</label>
    <input class="field" id="email" name="email" type="email">
    <label for="password">Password</label>
    <input class="field" id="password" name="password" type="password" required autocomplete="new-password">
    <button class="btn btn-primary" type="submit">Register</button>
  </form>
  <p class="mt-3">Already registered? <a href="/login">Log in</a>.</p>
</main>
</body>
</html>
