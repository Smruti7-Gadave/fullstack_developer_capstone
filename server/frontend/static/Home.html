<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cars Dealership</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/bootstrap.min.css">
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    .topbar { background: darkturquoise; min-height: 86px; display:flex; align-items:center; gap:32px; padding:14px 24px; }
    .topbar h2 { margin:0 28px 0 0; }
    .topbar a { color:#101820; font-size:18px; margin-right:16px; text-decoration:none; }
    .auth { margin-left:auto; white-space:nowrap; }
    .auth .username { color:white; font-weight:bold; font-size:20px; margin-right:20px; }
    .hero { max-width:860px; margin:44px auto; text-align:center; border:1px solid #ddd; border-radius:4px; overflow:hidden; }
    .hero img { width:100%; max-height:575px; object-fit:cover; display:block; }
    .hero-footer { padding:14px; }
    .hero-footer h5 { margin:0 0 16px; }
  </style>
</head>
<body>
<nav class="topbar">
  <h2>Dealerships</h2>
  <div>
    <a href="/">Home</a>
    <a href="/about">About Us</a>
    <a href="/contact">Contact Us</a>
  </div>
  <div class="auth">
    {% if user.is_authenticated %}
      <span class="username">{{ user.username }}</span>
      <a href="/logout">Logout</a>
    {% else %}
      <a href="/login">Login</a>
      <a href="/register">Register</a>
    {% endif %}
  </div>
</nav>
<main class="hero">
  <img src="/static/car_dealership.jpg" alt="Cars at a dealership">
  <div class="hero-footer">
    <h5>Welcome to our Dealerships!</h5>
    <a href="/dealers" class="btn" style="background-color:aqua">View Dealerships</a>
  </div>
</main>
</body>
</html>
